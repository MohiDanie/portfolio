<style>
/* Layout: screening room — one light source on a quiet stage; credits-style display type; the work floats in 3D once, in the hero.
   Type: EN = Archivo (display/labels) + Hanken Grotesk (text). FA = Vazirmatn, contrast by weight. Two families per language at most. */
:root{
  color-scheme:dark;
  --void:#08090B; --stage:#101216; --panel:#16191E; --ink:#ECEDEF; --muted:#9298A2; --line:#262A31;
  --brass:#D9C3A0; --brass-dim:#8C7A5E; --on-brass:#08090B; --tbc:#E3A86A; --ok:#7FD1A1;
  --glow:rgba(217,195,160,.12); --shadow:rgba(0,0,0,.85); --grain:.04; --veil:rgba(8,9,11,.74); --img-dim:.88;
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --t-xs:12.5px; --t-sm:14.5px; --t-base:17.5px; --t-md:20px; --t-lg:clamp(24px,2.6vw,32px);
  --t-xl:clamp(32px,4.4vw,56px); --t-2xl:clamp(40px,5.6vw,80px); --t-3xl:clamp(48px,8.4vw,124px);
  --wrap:1240px; --read:62ch; --r:6px; --tap:44px; --ease:cubic-bezier(.16,.84,.24,1);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light; --void:#F3F4F6; --stage:#EAECEF; --panel:#FFFFFF; --ink:#111318; --muted:#575C66; --line:#D6D9DF;
  --brass:#83622F; --brass-dim:#B29B78; --on-brass:#FFFFFF; --tbc:#A3540C; --ok:#17703D;
  --glow:rgba(176,140,86,.14); --shadow:rgba(20,24,32,.26); --grain:.025; --veil:rgba(243,244,246,.8); --img-dim:1}}
:root[data-theme="light"]{
  color-scheme:light; --void:#F3F4F6; --stage:#EAECEF; --panel:#FFFFFF; --ink:#111318; --muted:#575C66; --line:#D6D9DF;
  --brass:#83622F; --brass-dim:#B29B78; --on-brass:#FFFFFF; --tbc:#A3540C; --ok:#17703D;
  --glow:rgba(176,140,86,.14); --shadow:rgba(20,24,32,.26); --grain:.025; --veil:rgba(243,244,246,.8); --img-dim:1}
[lang="fa"]{--f-display:"Vazirmatn",ui-sans-serif,system-ui,sans-serif;--f-body:"Vazirmatn",ui-sans-serif,system-ui,sans-serif}

*{box-sizing:border-box}html,body{margin:0}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--ink);font:400 var(--t-base)/1.68 var(--f-body);-webkit-font-smoothing:antialiased;font-kerning:normal}
[lang="fa"] body{line-height:1.95;font-size:var(--t-base)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:var(--grain);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
::selection{background:var(--brass);color:var(--on-brass)}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:3px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(16px,5vw,56px)}
.skip{position:absolute;inset-inline-start:-999px;top:8px;background:var(--brass);color:var(--on-brass);padding:12px 16px;z-index:70;border-radius:4px}
.skip:focus{inset-inline-start:8px}
.ico{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:300;font-variation-settings:"wdth" 106}
h1{letter-spacing:-.03em} h2{letter-spacing:-.022em} h3{letter-spacing:-.01em}
[lang="fa"] h1,[lang="fa"] h2,[lang="fa"] h3{font-variation-settings:normal;letter-spacing:0}
p{margin:0;text-wrap:pretty}
.label{font:500 var(--t-xs)/1.4 var(--f-display);font-variation-settings:"wdth" 125;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
[lang="fa"] .label{font:500 14.5px/1.6 var(--f-body);letter-spacing:0;text-transform:none;font-variation-settings:normal}
.tag{font:500 var(--t-xs)/1 var(--f-display);font-variation-settings:"wdth" 125;color:var(--brass);letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
[lang="fa"] .tag{font:500 14.5px/1 var(--f-body);letter-spacing:0;text-transform:none;font-variation-settings:normal}

/* ---- draft system ---- */
.draftbar{background:color-mix(in srgb,var(--brass) 11%,var(--void));font-size:var(--t-sm);border-bottom:1px solid color-mix(in srgb,var(--brass) 25%,var(--void))}
.draftbar .wrap{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;padding-block:8px}
.draftbar .msg{margin-inline-end:auto}
.draftbar a,.draftbar button{font:500 14.5px/1 var(--f-body);background:none;border:1px solid var(--brass-dim);color:var(--brass);border-radius:999px;padding:0 16px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;text-decoration:none}
.draftbar button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.tbc{text-decoration:underline dotted var(--tbc) 1.5px;text-underline-offset:4px}
.ph{color:var(--tbc);font-style:normal}
.ph::before{content:"Confirm · ";font-weight:600}
[lang="fa"] .ph::before{content:"تأیید · "}
.chip-draft{display:inline-block;font:500 12.5px/1 var(--f-body);color:var(--tbc);border:1px dashed var(--tbc);border-radius:999px;padding:4px 12px;margin-inline-start:12px;vertical-align:middle}
.publish .chip-draft{display:none}
ul:not(:has(li:not([hidden]))){display:none}

/* ---- header ---- */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--veil);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
header.site .wrap{display:flex;align-items:center;gap:16px;min-height:68px}
.mark{text-decoration:none;display:flex;gap:12px;align-items:center;margin-inline-end:auto;min-height:var(--tap)}
.logo{height:30px;width:auto;flex:none;display:block;color:var(--ink);transition:color .4s}
.logo path{fill:currentColor}
.mark:hover .logo{color:var(--brass)}
.mark .logo{animation:markIn 1.2s var(--ease) both}
@keyframes markIn{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
[dir="rtl"] .mark .logo{animation-name:markInR}
@keyframes markInR{from{clip-path:inset(0 0 0 100%);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.wordmark{font:400 12.5px/1 var(--f-display);font-variation-settings:"wdth" 125;letter-spacing:.2em;text-transform:uppercase}
[lang="fa"] .wordmark{font:500 16px/1 var(--f-body);letter-spacing:0;font-variation-settings:normal;text-transform:none}
nav.main ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav.main a{text-decoration:none;font-size:14.5px;color:var(--muted);padding:0 12px;min-height:var(--tap);display:flex;align-items:center;position:relative;transition:color .3s}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink)}
nav.main a::after{content:"";position:absolute;inset-inline:12px;bottom:8px;height:1px;background:var(--brass);transform:scaleX(0);transition:transform .45s var(--ease)}
nav.main a:hover::after,nav.main a[aria-current="page"]::after{transform:scaleX(1)}
.langbtn,.menubtn,.iconbtn{font:500 14.5px/1 var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:0 16px;cursor:pointer;min-height:var(--tap);display:inline-flex;align-items:center;gap:8px;transition:border-color .3s,color .3s}
.iconbtn{width:var(--tap);padding:0;justify-content:center}
.langbtn:hover,.menubtn:hover,.iconbtn:hover{border-color:var(--brass);color:var(--brass)}
.langbtn[lang="fa"]{font-family:"Vazirmatn",sans-serif}
.langbtn[lang="en"]{font-family:"Hanken Grotesk",sans-serif}
.menubtn{display:none}
@media (max-width:860px){
  .menubtn{display:inline-flex}
  .wordmark{display:none}
  nav.main{position:absolute;inset-inline:0;top:100%;background:var(--void);border-bottom:1px solid var(--line)}
  nav.main[data-open="false"]{display:none}
  nav.main[data-open="true"]{animation:drop .4s var(--ease)}
  nav.main ul{flex-direction:column;gap:0;padding:8px clamp(16px,5vw,56px) 20px}
  nav.main a{padding:0;min-height:56px;border-bottom:1px solid var(--line);font:300 24px/1 var(--f-display);color:var(--ink)}
  nav.main a::after{display:none}
  nav.main a[aria-current="page"]{color:var(--brass)}
}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@media (max-width:420px){.langbtn span{display:none}.langbtn{width:var(--tap);padding:0;justify-content:center}.menubtn span{display:none}.menubtn{width:var(--tap);padding:0;justify-content:center}}

/* ---- buttons ---- */
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 24px;border-radius:999px;font:500 16px/1 var(--f-body);text-decoration:none;cursor:pointer;border:1px solid var(--line);transition:background .35s var(--ease),color .35s,border-color .35s,transform .35s var(--ease)}
.btn.primary{background:var(--ink);color:var(--void);border-color:var(--ink)}
.btn.primary:hover{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}
.btn:active{transform:scale(.97)}
.textlink{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);text-decoration:none;border-bottom:1px solid var(--line);color:var(--ink);transition:color .3s,border-color .3s}
.textlink:hover{color:var(--brass);border-color:var(--brass)}
.arrow{transition:transform .35s var(--ease)}
[dir="rtl"] .arrow{transform:scaleX(-1)}
a:hover .arrow{transform:translateX(4px)}
[dir="rtl"] a:hover .arrow{transform:scaleX(-1) translateX(4px)}
.back{transform:scaleX(-1)} [dir="rtl"] .back{transform:none}

section{padding-block:clamp(56px,9vw,128px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:clamp(32px,4.5vw,56px)}
.sec-head h2{font-size:var(--t-xl);line-height:1.04}
[lang="fa"] .sec-head h2{line-height:1.45}
.sec-head .label{max-width:36ch;text-align:end}
a.label{display:inline-flex;gap:8px;align-items:center;min-height:var(--tap);text-decoration:none;color:var(--ink)}
a.label:hover{color:var(--brass)}
@media (max-width:640px){.sec-head{grid-template-columns:1fr}.sec-head .label{text-align:start}}

/* ---- hero ---- */
.stage{position:relative;padding-block:clamp(32px,5vw,64px) clamp(48px,7vw,96px);overflow:hidden;isolation:isolate}
.stage::before{content:"";position:absolute;z-index:-1;inset:-20% -10% auto;height:120%;background:radial-gradient(55% 55% at 72% 22%,var(--glow),transparent 70%)}
[dir="rtl"] .stage::before{transform:scaleX(-1)}
.stage .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:24px}
.eyebrow .sep{width:18px;height:1px;background:var(--line)}
.stage h1{font-size:var(--t-2xl);line-height:1;font-weight:200}
.stage h1 em{font-style:normal;color:var(--brass)}
[lang="fa"] .stage h1{line-height:1.42;font-size:clamp(34px,4.6vw,66px)}
.w{display:inline-block;animation:wordIn 1s var(--ease) both;animation-delay:calc(var(--d) * 60ms + 100ms)}
@keyframes wordIn{from{opacity:.15;transform:translateY(.3em);filter:blur(6px)}}
.stage .lede{color:var(--muted);max-width:52ch;margin-top:24px;font-size:var(--t-md);animation:soft 1s var(--ease) .5s both}
.stage .lede strong{color:var(--ink);font-weight:500}
.stage .btns{margin-top:32px;animation:soft 1s var(--ease) .65s both}
@keyframes soft{from{opacity:.2;transform:translateY(10px)}}
.scene{perspective:1600px;height:clamp(320px,38vw,500px);position:relative;--rx:0deg;--ry:0deg}
.stack{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(calc(52deg + var(--rx))) rotateZ(calc(-32deg + var(--ry)));transition:transform 1s var(--ease)}
[dir="rtl"] .stack{transform:rotateX(calc(52deg + var(--rx))) rotateZ(calc(32deg + var(--ry)))}
.layer{position:absolute;left:12%;top:18%;width:72%;aspect-ratio:16/10;border-radius:6px;overflow:hidden;transform:translateZ(calc(var(--i) * 60px));
  box-shadow:0 40px 60px -20px var(--shadow),0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent);
  animation:layerIn 1.3s var(--ease) both, float 10s ease-in-out infinite;animation-delay:calc(var(--i) * 110ms + 150ms), calc(var(--i) * -1.4s + 1.6s);background:var(--panel);text-decoration:none;transition:box-shadow .5s}
.layer img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(var(--img-dim));transition:filter .6s}
.layer:hover img,.layer:focus-visible img{filter:none}
.layer:hover{box-shadow:0 60px 80px -20px var(--shadow),0 0 0 1px var(--brass)}
.layer::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 38%);pointer-events:none}
.layer span{position:absolute;inset-inline-start:12px;bottom:10px;font:500 11.5px/1 var(--f-display);font-variation-settings:"wdth" 125;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.62);padding:8px 8px;border-radius:2px}
[lang="fa"] .layer span{font:500 12.5px/1 var(--f-body);letter-spacing:0;font-variation-settings:normal}
@keyframes layerIn{from{transform:translateZ(calc(var(--i) * 60px + 300px));opacity:.1}}
@keyframes float{0%,100%{transform:translateZ(calc(var(--i) * 60px))}50%{transform:translateZ(calc(var(--i) * 60px + 16px))}}
@media (max-width:900px){.stage .wrap{grid-template-columns:1fr}.scene{height:clamp(240px,66vw,380px);margin-top:96px}.layer{top:28%;left:14%;width:70%}}

/* ---- selected work ---- */
.feat{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;text-decoration:none}
.shot-wrap{perspective:1200px}
.shot{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--panel);transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));transition:transform .7s var(--ease);box-shadow:0 30px 80px -30px var(--shadow),0 0 0 1px color-mix(in srgb,var(--ink) 7%,transparent)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(var(--img-dim));transition:filter .6s,transform 1.2s var(--ease)}
a:hover .shot img{filter:none;transform:scale(1.03)}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.16),transparent 45%);opacity:0;transition:opacity .5s}
a:hover .glare{opacity:1}
.copy{display:flex;flex-direction:column;gap:16px;min-width:0}
.feat h3{font-size:var(--t-xl);line-height:1.02}
[lang="fa"] .feat h3{line-height:1.4}
.copy > p{color:var(--muted);max-width:46ch}
.meta{display:flex;gap:8px 16px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:8px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.go{display:inline-flex;gap:12px;align-items:center;font-weight:500;color:var(--ink);margin-top:4px;padding-bottom:8px;border-bottom:1px solid var(--line);align-self:flex-start;transition:border-color .3s,color .3s}
a:hover .go{border-color:var(--brass);color:var(--brass)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,48px);margin-top:clamp(56px,8vw,96px)}

   <section><div class="sec-head"><h2>${E?"Icons":"آیکون‌ها"}</h2><span class="label">${E?"24px grid · 1.5 stroke":"شبکه ۲۴ پیکسل · خط ۱٫۵"}</span></div>
     <div class="icons">${Object.keys(ICONS).map(n=>`<div>${ico(n)}<span class="label">${n}</span></div>`).join("")}</div></section>
   <section><div class="sec-head"><h2>${E?"Typography":"تایپوگرافی"}</h2><span class="label">${E?"Two families per language at most":"حداکثر دو خانواده در هر زبان"}</span></div>
     <div class="specimen">
       <div lang="en" dir="ltr" style="display:flex;flex-direction:column;gap:14px"><span style="font:200 clamp(44px,6vw,84px)/1 'Archivo',sans-serif;letter-spacing:-.03em">Archivo 200</span><p style="font-family:'Hanken Grotesk',sans-serif;color:var(--muted)">Archivo for headlines and labels, using its width axis. Hanken Grotesk for reading text at 17.5px on a 1.68 line.</p></div>
       <div lang="fa" dir="rtl" style="display:flex;flex-direction:column;gap:14px"><span style="font:200 clamp(40px,5.4vw,76px)/1.3 'Vazirmatn',sans-serif">وزیرمتن ۲۰۰</span><p style="font-family:'Vazirmatn',sans-serif;color:var(--muted);line-height:1.95">وزیرمتن برای تیترها با وزن ۲۰۰ و ۳۰۰، و برای متن با وزن ۴۰۰. ارقام در نسخه فارسی فارسی‌اند.</p></div>
     </div></section>
   <section><div class="sec-head"><h2>${E?"Colour":"رنگ"}</h2><span class="label">${E?"Each colour has a light and a dark value":"هر رنگ یک مقدار روشن و یک مقدار تیره دارد"}</span></div>
     <div class="swatches">${sw.map(([v,n])=>`<div><i style="background:var(${v})"></i><span>${n}<br><code>${v}</code></span></div>`).join("")}</div></section>
  </div>`;
}

/* Review page: collects every confirmation item from every page, in the current language. */
function pageReview(){
  const E=en(), pages=[[E?"Home":"خانه",pageHome],[E?"Work":"نمونه‌کارها",pageWork],...CASES.map(c=>[L(c.title),()=>pageCase(c)]),[u().nav.about,pageAbout],[u().nav.resume,pageResume],[u().nav.contact,pageContact]];
  const seen=new Set(); let total=0;
  const groups = pages.map(([name,fn])=>{
    const t=document.createElement("template"); t.innerHTML=fn();
    const items=[...t.content.querySelectorAll(".tbc")].map(el=>({txt:el.textContent.trim(),p:el.classList.contains("ph")})).filter(x=>x.txt && !seen.has(x.txt) && seen.add(x.txt));
    total+=items.length;
    return items.length?`<div class="review-group"><span class="label">${name}</span><ol>${items.map(x=>`<li class="${x.p?"p":""}">${x.p?(E?"Missing: ":"ناقص: "):(E?"Confirm: ":"تأیید: ")}${x.txt}</li>`).join("")}</ol></div>`:"";
  }).join("");
  return `<div class="wrap"><div class="phead"><span class="label">${E?"Draft only":"فقط در پیش‌نویس"}</span><h1 id="pageTitle" tabindex="-1">${E?`${total} items to confirm before launch`:`${nn(total)} مورد برای تأیید پیش از انتشار`}</h1>
   <p>${E?"“Confirm” means I wrote a plausible default from your files. “Missing” means only you know the answer. In the publish version, every item on this list is hidden rather than shown as fact.":"«تأیید» یعنی پیش‌فرضی است که از روی فایل‌هایتان نوشته‌ام. «ناقص» یعنی فقط شما جواب را می‌دانید. در نسخه انتشار، همه موارد این فهرست پنهان می‌شوند و به‌عنوان واقعیت نمایش داده نمی‌شوند."}</p></div>
   <section style="padding-top:0">${groups}</section></div>`;
}

/* ============================ ROUTER & CHROME ============================ */
const ROUTES = {home:pageHome, work:pageWork, about:pageAbout, resume:pageResume, contact:pageContact, brand:pageBrand, review:pageReview};
function current(){
  const h=(location.hash||"").slice(1).replace(/^puzzlelity/,"puzzleity");
  const cs=CASES.find(c=>h===c.slug||h.startsWith(c.slug+"-"));
  if(cs) return {r:"case",c:cs,anchor:h.startsWith(cs.slug+"-")?h:null};
  if(h==="main") return {r:"__skip"};
  if(h==="review" && (!S.draft_mode)) return {r:"home"};
  if(ROUTES[h]) return {r:h};
  if(h==="selected") return {r:"home",anchor:"selected"};
  return {r:"home"};
}
function titleFor(cur){
  if(cur.r==="case") return L(cur.c.title);
  if(cur.r==="brand") return en()?"Brand":"هویت بصری";
  if(cur.r==="review") return en()?"Review":"بررسی";
  return u().nav[cur.r] || null;
}
function renderChrome(){
  const U=u(), E=en();
  document.documentElement.lang=lang; document.documentElement.dir=E?"ltr":"rtl"; syncPath();
  document.getElementById("skiplink").textContent=U.skip;
  const mk=document.getElementById("markLink"); mk.innerHTML=`${LOGO()}<span class="wordmark">${NAME()}</span>`; mk.setAttribute("aria-label",E?"Mohadese Danaie, home":"محدثه دانائی، صفحه اصلی");
  const lb=document.getElementById("langBtn"); lb.innerHTML=`${ico("globe")}<span>${U.lang}</span>`; lb.lang=E?"fa":"en"; lb.setAttribute("aria-label",E?"نمایش سایت به فارسی":"View site in English");
  document.getElementById("navlist").innerHTML=["work","about","resume","contact"].map(r=>`<li><a href="#${r}" data-r="${r}">${U.nav[r]}</a></li>`).join("");
  document.getElementById("mainnav").setAttribute("aria-label",E?"Main":"منوی اصلی");
  setMenu(false);
  const bar=document.getElementById("draftbar"); bar.hidden=!S.draft_mode;
  document.getElementById("draftText").textContent=U.draft;
  const pb=document.getElementById("publishBtn"); pb.textContent=U.publish; pb.setAttribute("aria-pressed",String(publish));
  document.getElementById("reviewLink").textContent=U.review;
  document.body.classList.toggle("publish",publish);
  paintThemeBtn();
  document.querySelector(".c-ring b").textContent=U.view;
  document.getElementById("foot").innerHTML=`
   <div style="display:flex;flex-direction:column;gap:12px"><span class="lockup">${LOGO()}<span><strong style="color:var(--ink);font-weight:500">${NAME()}</strong><br>${U.footTitle}</span></span><span dir="ltr" style="user-select:all">${S.email}</span></div>
   <nav aria-label="${E?"Footer":"پاورقی"}"><ul>${["work","about","resume","contact"].map(r=>`<li><a href="#${r}">${U.nav[r]}</a></li>`).join("")}${S.linkedin?`<li><a href="${S.linkedin}" target="_blank" rel="noopener">LinkedIn</a></li>`:""}<li><a href="#brand">${E?"Brand":"هویت بصری"}</a></li></ul></nav>
   <div>© ${E?"2026":"۱۴۰۵"} ${NAME()}.<br>${U.rights}</div>`;
}
function setMenu(open){
  const nav=document.getElementById("mainnav"), mb=document.getElementById("menuBtn");
  nav.dataset.open=String(open); mb.setAttribute("aria-expanded",String(open));
  mb.innerHTML=`${ico(open?"close":"menu")}<span>${open?u().close:u().menu}</span>`;
  mb.setAttribute("aria-label",open?u().close:u().menu);
}
/* Publish mode: hide each unconfirmed item together with any container that holds nothing else. */
function applyPublish(root){
  root.querySelectorAll("[data-hid]").forEach(n=>{n.hidden=false;n.removeAttribute("data-hid");});
  if(!publish) return;
  const stop="main,section,article,.wrap,.chapter,.cbox,.prose,.cs-hero,.copy,.stage,.two,.glance,.facts,.kv,.tl,.job>div,.btns";
  const hide=n=>{n.hidden=true;n.setAttribute("data-hid","");};
  root.querySelectorAll("[data-draft]").forEach(hide);
  root.querySelectorAll(".tbc").forEach(el=>{
    const txt=el.textContent.trim(); let n=el;
    while(n.parentElement && !n.parentElement.matches(stop) && n.parentElement.textContent.trim()===txt) n=n.parentElement;
    if(n.tagName==="DD"){ const dt=n.previousElementSibling; if(dt&&dt.tagName==="DT") hide(dt); if(n.parentElement.tagName==="DIV"&&n.parentElement.parentElement.matches(".facts")) n=n.parentElement; }
    if(n.parentElement && n.parentElement.matches(".glance>div") ) n=n.parentElement;
    hide(n);
  });
  const vis=x=>!x.hidden && (x.tagName==="IMG" || [...x.childNodes].some(k=>k.nodeType===3?k.textContent.trim():k.nodeType===1&&vis(k)));
  root.querySelectorAll(".chapter").forEach(ch=>{
    const live=[...ch.children].filter(x=>!x.hidden && !x.matches(".tag,h2") && vis(x));
    if(!live.length){ hide(ch); const t=root.querySelector(`.toc [data-jump="${ch.id}"]`); if(t) hide(t); }
  });
  let k=0; root.querySelectorAll(".chapter").forEach(ch=>{ if(!ch.hidden){ const t=ch.querySelector(":scope>.tag"); if(t) t.textContent=nn(++k); } });
}
let lastKey=null;
function render(force){
  if(!LOADED) return;
  const cur=current();
  if(cur.r==="__skip"){ document.getElementById("main").focus(); return; }
  const key=cur.r==="case"?cur.c.slug:cur.r;
  renderChrome();
  if(!force && key===lastKey && cur.anchor){ jump(cur.anchor); return; }
  const main=document.getElementById("main");
  main.innerHTML=`<div class="fade">${cur.r==="case"?pageCase(cur.c):ROUTES[cur.r]()}</div>`;
  applyPublish(main);
  const t=titleFor(cur), name=NAME();
  document.title = t ? `${t} · ${name}` : `${name} · ${en()?"Product Designer":"طراح محصول"}`;
  const md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute("content", en()?"Mohadese Danaie is a product designer in Tehran who has also worked as a product manager. Case studies in recruiting, AI data analytics and education products.":"محدثه دانائی، طراح محصول در تهران با سابقه مدیریت محصول. کیس‌استادی‌هایی در حوزه استخدام، تحلیل داده با هوش مصنوعی و آموزش.");
  document.querySelectorAll("#navlist a").forEach(a=>{ const on=a.dataset.r===cur.r||(cur.r==="case"&&a.dataset.r==="work"); on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"); });
  wire();
  if(cur.anchor) jump(cur.anchor);
  else if(lastKey!==null && key!==lastKey){ window.scrollTo(0,0); const h=document.getElementById("pageTitle"); if(h) h.focus({preventScroll:true}); }
  lastKey=key;
}
const jump = id => { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:MOTION?"smooth":"auto"}); };

/* ============================== BEHAVIOUR ============================== */
function wire(){
  document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    const box=b.closest(".cta,.cbox"), out=box.querySelector(".copied"), val=box.querySelector(".mailline,.val");
    const ok=()=>out.textContent=K().copied;
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(val); const s=getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent=en()?"Selected. Press Ctrl+C or ⌘C to copy.":"انتخاب شد. برای کپی Ctrl+C یا ⌘C بزنید."; };
    try{ navigator.clipboard.writeText(S.email).then(ok,fallback); }catch(e){ fallback(); }
  }));
  const stage=document.getElementById("stage"), scene=document.getElementById("scene");
  if(stage&&scene&&MOTION&&FINE){
    stage.addEventListener("pointermove",e=>{ const r=stage.getBoundingClientRect(); scene.style.setProperty("--rx",(((e.clientY-r.top)/r.height-.5)*-10).toFixed(2)+"deg"); scene.style.setProperty("--ry",(((e.clientX-r.left)/r.width-.5)*12).toFixed(2)+"deg"); });
    stage.addEventListener("pointerleave",()=>{ scene.style.setProperty("--rx","0deg"); scene.style.setProperty("--ry","0deg"); });
  }
  if(MOTION&&FINE) document.querySelectorAll("[data-tilt]").forEach(el=>{
    el.addEventListener("pointermove",e=>{ const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      el.style.setProperty("--ty",((x-.5)*8).toFixed(2)+"deg"); el.style.setProperty("--tx",((.5-y)*6).toFixed(2)+"deg"); el.style.setProperty("--gx",(x*100).toFixed(1)+"%"); el.style.setProperty("--gy",(y*100).toFixed(1)+"%"); });
    el.addEventListener("pointerleave",()=>{ el.style.setProperty("--tx","0deg"); el.style.setProperty("--ty","0deg"); });
  });
  tocSpy(); onScroll();
}
let spy=null;
function tocSpy(){
  if(spy){spy.disconnect();spy=null;}
  const links=[...document.querySelectorAll(".toc a")]; if(!links.length||!("IntersectionObserver" in window)) return;
  spy=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting) links.forEach(a=>a.classList.toggle("on",a.dataset.jump===x.target.id)); }),{rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll(".chapter").forEach(c=>spy.observe(c));
}
let ticking=false;
function onScroll(){
  const f=document.querySelector(".cs-figure .figure"); if(!f||!MOTION) return;
  const r=f.getBoundingClientRect(), p=Math.min(1,Math.max(0,(innerHeight-r.top)/(innerHeight*.85)));
  f.style.setProperty("--fx",(14*(1-p)).toFixed(2)+"deg"); f.style.setProperty("--fs",(.95+.05*p).toFixed(3));
}
addEventListener("scroll",()=>{ if(!ticking){ ticking=true; requestAnimationFrame(()=>{onScroll();ticking=false;}); } },{passive:true});

/* theme */
const isDark=()=>theme?theme==="dark":sysDark.matches;
function paintThemeBtn(){ const b=document.getElementById("themeBtn"), d=isDark(), l=en()?(d?"Switch to light theme":"Switch to dark theme"):(d?"تغییر به تم روشن":"تغییر به تم تاریک"); b.innerHTML=ico(d?"sun":"moon"); b.setAttribute("aria-label",l); b.title=l; }
function applyTheme(){ theme?document.documentElement.setAttribute("data-theme",theme):document.documentElement.removeAttribute("data-theme"); paintThemeBtn(); }
sysDark.addEventListener?.("change",()=>{ if(!theme) paintThemeBtn(); });
document.getElementById("themeBtn").addEventListener("click",e=>{
  const flip=()=>{ theme=isDark()?"light":"dark"; try{localStorage.setItem("md-theme",theme)}catch(_){} applyTheme(); };
  if(!document.startViewTransition||!MOTION){ flip(); return; }
  const r=e.currentTarget.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(flip);
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:700,easing:"cubic-bezier(.16,.84,.24,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
});

/* controls */
document.getElementById("langBtn").addEventListener("click",()=>{ lang=en()?"fa":"en"; try{localStorage.setItem("md-lang",lang)}catch(e){} render(true); });
document.getElementById("publishBtn").addEventListener("click",()=>{ publish=!publish; try{localStorage.setItem("md-publish",publish?"1":"0")}catch(e){} if(publish&&current().r==="review"){ location.hash="#home"; } render(true); });
document.getElementById("menuBtn").addEventListener("click",()=>{ const open=document.getElementById("mainnav").dataset.open!=="true"; setMenu(open); if(open){ const a=document.querySelector("#navlist a"); if(a) a.focus(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.getElementById("mainnav").dataset.open==="true"){ setMenu(false); document.getElementById("menuBtn").focus(); } });
addEventListener("hashchange",()=>render(false));

/* cursor: ring trails the native pointer; grows over links, becomes a lens over work */
(function(){
  if(!(FINE&&MOTION)) return;
  const c=document.getElementById("cursor"), ring=c.querySelector(".c-ring");
  document.documentElement.classList.add("has-cursor");
  let x=-200,y=-200,rx=x,ry=y,raf=null;
  const loop=()=>{ rx+=(x-rx)*.22; ry+=(y-ry)*.22; ring.style.transform=`translate(${rx}px,${ry}px)`; raf=Math.hypot(x-rx,y-ry)>.2?requestAnimationFrame(loop):null; };
  addEventListener("pointermove",e=>{ if(e.pointerType&&e.pointerType!=="mouse") return; x=e.clientX; y=e.clientY; c.classList.remove("hide"); if(!raf) raf=requestAnimationFrame(loop); },{passive:true});
  document.addEventListener("pointerover",e=>{ const t=e.target.closest&&e.target.closest("a,button"); const view=!!(t&&t.matches(".feat,.card,.layer,.archive a")); c.classList.toggle("view",view); c.classList.toggle("link",!!t&&!view); });
  document.documentElement.addEventListener("mouseleave",()=>c.classList.add("hide"));
})();

applyTheme();
(async function boot(){
  const get = p => fetch(p,{cache:"no-cache"}).then(x=>{ if(!x.ok) throw new Error(p+" "+x.status); return x.json(); });
  try{
    const [s,h,a,x,c,ar,w] = await Promise.all(["settings","home","about","experience","contact","archive","work"].map(n=>get(`/content/${n}.json`)));
    S=Object.assign(S,s); HOMEd=h; ABOUT=a; EXP=x; CONTACT=c; ARCH=ar; CASES=(w.cases||[]).filter(c=>c&&c.slug);
    publish=!S.draft_mode;
    if(S.draft_mode){ try{ if(localStorage.getItem("md-publish")==="1") publish=true; }catch(e){} }
    LOADED=true; render(true);
  }catch(e){
    document.getElementById("main").innerHTML=`<div class="wrap"><div class="phead"><h1>Content could not load</h1><p>${String(e.message)}</p></div></div>`;
  }
})();

</script>
