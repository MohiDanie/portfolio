media:
  input: images
  output: /images
content:
- name: work
  label: نمونه‌کارها (کیس‌استادی‌ها)
  type: file
  path: content/work.json
  format: json
  fields:
  - name: cases
    label: کیس‌استادی‌ها — ترتیب همین فهرست ترتیب سایت است
    type: object
    list: true
    fields:
    - name: slug
      label: آدرس کوتاه (انگلیسی)
      type: string
      description: مثلاً puzzleity — صفحه روی mdanaie.ir/#puzzleity باز می‌شود
    - name: secondary
      label: فقط در «کارهای دیگر» نشان بده (نه منتخب)
      type: boolean
    - name: title
      label: نام پروژه
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: fa
        label: فارسی
        type: string
    - name: category
      label: دسته
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: fa
        label: فارسی
        type: string
    - name: year
      label: شرکت / سال
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: fa
        label: فارسی
        type: string
    - name: cover
      label: تصویر اصلی
      type: image
    - name: teaser
      label: خلاصه کارت
      type: object
      fields:
      - name: en
        label: English
        type: text
      - name: fa
        label: فارسی
        type: text
    - name: summary
      label: زیرتیتر کیس‌استادی
      type: object
      fields:
      - name: en
        label: English
        type: text
      - name: fa
        label: فارسی
        type: text
    - name: glance
      label: خلاصه چهارخانه
      type: object
      fields:
      - name: problem
        label: مسئله
        type: object
        fields:
        - name: en
          label: English
          type: text
        - name: fa
          label: فارسی
          type: text
      - name: users
        label: کاربران
        type: object
        fields:
        - name: en
          label: English
          type: text
        - name: fa
          label: فارسی
          type: text
      - name: role
        label: نقش
        type: object
        fields:
        - name: en
          label: English
          type: text
        - name: fa
          label: فارسی
          type: text
      - name: outcome
        label: نتیجه
        type: object
        fields:
        - name: en
          label: English
          type: text
        - name: fa
          label: فارسی
          type: text
        description: برای متنی که باید تأیید شود {? متن ?} و برای اطلاعات ناقص {! متن !} بنویس. این‌ها روی سایت فقط در حالت پیش‌نویس دیده می‌شوند.
    - name: facts
      label: مشخصات
      type: object
      fields:
      - name: role
        label: نقش
        type: object
        fields:
        - name: en
          label: English
          type: string
        - name: fa
          label: فارسی
          type: string
      - name: team
        label: تیم
        type: object
        fields:
        - name: en
          label: English
          type: string
        - name: fa
          label: فارسی
          type: string
      - name: time
        label: زمان
        type: object
        fields:
        - name: en
          label: English
          type: string
        - name: fa
          label: فارسی
          type: string
      - name: platform
        label: پلتفرم
        type: object
        fields:
        - name: en
          label: English
          type: string
        - name: fa
          label: فارسی
          type: string
      - name: status
        label: وضعیت
        type: object
        fields:
        - name: en
          label: English
          type: string
        - name: fa
          label: فارسی
          type: string
    - name: chapters
      label: بخش‌های کیس‌استادی
      type: object
      list: true
      fields:
      - name: id
        label: شناسه بخش (انگلیسی، بدون فاصله)
        type: string
        description: مثلاً context یا decisions — در آدرس صفحه استفاده می‌شود
      - name: title
        label: عنوان بخش
        type: object
        fields:
        - name: en
          label: English
          type: string
        - name: fa
          label: فارسی
          type: string
      - name: draft_rationale
        label: برچسب «استدلال پیش‌نویس»
        type: boolean
      - name: body
        label: متن
        type: object
        fields:
        - name: en
          label: English
          type: rich-text
        - name: fa
          label: فارسی
          type: rich-text
        description: برای متنی که باید تأیید شود {? متن ?} و برای اطلاعات ناقص {! متن !} بنویس. این‌ها روی سایت فقط در حالت پیش‌نویس دیده می‌شوند.
      - name: note
        label: یادداشت برجسته (کادر کناری)
        type: object
        fields:
        - name: en
          label: English
          type: text
        - name: fa
          label: فارسی
          type: text
      - name: decisions
        label: تصمیم‌ها
        type: object
        list: true
        fields:
        - name: title
          label: عنوان تصمیم
          type: object
          fields:
          - name: en
            label: English
            type: string
          - name: fa
            label: فارسی
            type: string
        - name: text
          label: چه کردیم
          type: object
          fields:
          - name: en
            label: English
            type: text
          - name: fa
            label: فارسی
            type: text
        - name: why
          label: چرا
          type: object
          fields:
          - name: en
            label: English
            type: text
          - name: fa
            label: فارسی
            type: text
      - name: gallery
        label: تصاویر
        type: object
        list: true
        fields:
        - name: image
          label: تصویر
          type: image
        - name: caption
          label: توضیح تصویر
          type: object
          fields:
          - name: en
            label: English
            type: text
          - name: fa
            label: فارسی
            type: text
